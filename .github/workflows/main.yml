name: CI/CD Pipeline

# 1. THE TRIGGER
on:
  push:
    branches: [ main ]

jobs:
  # 2. THE BUILD & TEST JOB
  build-and-test:
    runs-on: ubuntu-latest # THE ENVIRONMENT
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup SDK/Runtime
      uses: actions/setup-dotnet@v4 # (Or setup-node, setup-python, etc.)
      with:
        dotnet-version: '10.0'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Run Tests
      run: dotnet test --no-restore

